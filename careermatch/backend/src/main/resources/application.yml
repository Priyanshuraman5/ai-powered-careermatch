spring:
  application:
    name: career-match-backend

  profiles:
    active: dev

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/careermatch?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DATABASE_USER:root}
    password: ${DATABASE_PASSWORD:702795}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: never # Changed from 'always' to prevent duplicate key crashes on restart
      data-locations: classpath:db/seed.sql

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  jwt:
    secret: "change-this-super-secret-key-in-production-min-256-bits-long!!"
    expiration-ms: 86400000
  cors:
    allowed-origins: "http://localhost:5173"
  upload:
    # Folder on the SERVER filesystem where uploaded files are permanently kept.
    # Use an absolute path in production so it survives redeploys, e.g. /var/careermatch/uploads
    dir: ${UPLOAD_DIR:uploads}
    # Public URL prefix the frontend uses to load/download files (served statically, see FileStorageConfig)
    base-url: /uploads

serpapi:
  key: ${SERPAPI_KEY:66b250f45f6b034af25c3960199782f2ea565276bc256f10d4b3cee5003ea64c}

---

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/careermatch?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USER:careermatch}
    password: ${DATABASE_PASSWORD:careermatch}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never