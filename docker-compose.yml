services:
  # MySQL 8.0 Database
  mysql:
    image: mysql:8.0
    container_name: careermatch-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-careermatch}
      MYSQL_USER: ${MYSQL_USER:-careermatch}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-careermatch}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Spring Boot 3 / Java 17 Backend
  backend:
    build:
      context: ./careermatch/backend
      dockerfile: Dockerfile
    container_name: careermatch-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-careermatch}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATABASE_USER: ${MYSQL_USER:-careermatch}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-careermatch}
      JWT_SECRET: ${JWT_SECRET:-super-secure-production-jwt-token-secret-minimum-256-bits-long!!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost,http://127.0.0.1}
      SERPAPI_KEY: ${SERPAPI_KEY:-66b250f45f6b034af25c3960199782f2ea565276bc256f10d4b3cee5003ea64c}
      UPLOAD_DIR: /app/uploads
      PORT: 8080
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  # React / Vite Production Frontend (Nginx)
  frontend:
    build:
      context: ./careermatch/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: careermatch-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    name: careermatch_mysql_data
  uploads_data:
    name: careermatch_uploads_data
